<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/landing/static/style.css">
    <link rel="icon" type="image/png" href="/landing/static/images/yogabar.png">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-header">
            <h1>Reset Password</h1>
            <p>We'll send an OTP to your registered email</p>
        </div>

        <div id="messageBanner" class="message-banner"></div>

        <!-- Step 1 - Email -->
        <div id="emailSection" class="form-container active">
            <form id="emailForm">
                <div class="field-group">
                    <label class="field-label">Email</label>
                    <input type="email" name="email" required autocomplete="email">
                </div>
                <div class="field-group">
                    <label class="field-label">Username</label>
                    <input type="text" name="username" required autocomplete="username">
                </div>
                <button type="submit" class="auth-btn">Send OTP</button>
            </form>
        </div>

        <!-- Step 2 - OTP + New Password -->
        <div id="otpSection" class="form-container">
            <form id="otpForm">
                <div class="field-group">
                    <label class="field-label">OTP</label>
                    <input type="text" name="otp" required maxlength="6" placeholder="6-digit code">
                </div>
                <div class="field-group">
                    <label class="field-label">New Password</label>
                    <input type="password" name="new_password" required autocomplete="new-password">
                </div>
                <button type="submit" class="auth-btn">Reset Password</button>
            </form>
        </div>
        <button class="forgot-pw" onclick="window.location.href='/'">Back to Login</button>
    </div>

    <script>
        const messageBanner = document.getElementById('messageBanner');
        const emailSection = document.getElementById('emailSection');
        const otpSection = document.getElementById('otpSection');
        let submittedEmail = '';

        function displayMessage(text, isError = true) {
            messageBanner.textContent = text;
            messageBanner.className = `message-banner ${isError ? 'error' : 'success'}`;
        }

        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(emailForm));
            submittedEmail = emailForm.querySelector('input[name="email"]').value;

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                displayMessage(data.message, false);
                emailSection.classList.remove('active');
                otpSection.classList.add('active');
            } catch (err) {
                displayMessage("Network error. Try again.");
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = otpForm.querySelector('input[name="otp"]').value;
            const new_password = otpForm.querySelector('input[name="new_password"]').value;

            const formData = new URLSearchParams();
            formData.append('email', submittedEmail);
            formData.append('otp', otp);
            formData.append('new_password', new_password);

            try {
                const response = await fetch('/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();

                if (!response.ok) {
                    displayMessage(data.detail || "Something went wrong.");
                    return;
                }
                displayMessage("Password reset successful! Redirecting...", false);
                setTimeout(() => window.location.href = '/', 1500);
            } catch (err) {
                displayMessage("Network error. Try again.");
            }
        });
    </script>
</body>
</html>
