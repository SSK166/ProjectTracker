<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="app">

        <div class="sidebar">
            <h2>Projects</h2>
            <div id="project-list"></div>
        </div>

        <div class="main">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('tracker')">Project Tracker</button>
                <button class="tab-btn" onclick="switchTab('add-project-tab')">Add Project</button>
                <button class="tab-btn" onclick="switchTab('alerts')">Alerts</button>

            </div>

            <div id="tab-tracker" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
                <div class="main-header">
                    <h1 id="selected-project-name">Select a project</h1>
                </div>
                <div class="table-wrapper">
                    <table id="project-table">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-alerts" style="display:none;flex-direction:column;flex:1;overflow:hidden">
                <div class="main-header">
                    <h1>Overdue Items</h1>
                </div>
                <div class="table-wrapper">
                    <table id="alerts-table">
                        <thead>
                            <tr>
                                <th>Project</th>
                                <th>Packaging</th>
                                <th>Option</th>
                                <th>Status Field</th>
                                <th>Current Value</th>
                                <th>Deadline</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="add-project-tab" id="add-project-tab" style="display:none;flex-direction:column;flex:1;overflow:hidden">
                <div class="add-project-ip">
                    <label class="add-label" for="new-project-name">Project Name</label>
                    <input class="add-ip" type="text" id="new-project-name" placeholder="Project Name">
                    
                    <label class="add-label" for="new-packaging-type">Packaging Type</label>
                    <input class="add-ip" type="text" id="new-packaging-type" placeholder="Packaging Type">    
                    
                    <label class="add-label" for="new-packaging-option">Packaging Option</label>
                    <input class="add-ip" type="text" id="new-packaging-option" placeholder="Packaging Option">
                </div>
                
                <button class="add-project-btn" onclick="addProject()">Add Project</button>
            </div>
        </div>

        <div class="panel" id="side-panel">
            <div class="panel-header">
                <h3 id="panel-title">Row Details</h3>
                <button class="close-btn" onclick="closePanel()">✕</button>
            </div>
            <div class="panel-body" id="panel-body"></div>
            <div class="panel-footer" style="display:flex; flex-direction:column; gap:10px;">
                <button class="save-btn" onclick="savePanel()">Save Changes</button>
                <button class="delete-btn" onclick="deleteProject()">Delete Project</button>
            </div>
        </div>

        <div class="overlay" id="overlay" onclick="closePanel()"></div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
